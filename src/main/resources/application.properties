spring.application.name=music-library

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/music_library
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT settings - override in production via env vars
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - comma-separated list of allowed origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Actuator health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
